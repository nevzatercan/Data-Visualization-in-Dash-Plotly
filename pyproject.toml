[project]
name = "dashapp"
version = "0.1.0"
description = "Plotly Dash görselleştirme paneli — DSÖ ölüm + PM2.5 + COVID verileri"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "nevzatercan" }
]
dependencies = [
    "dash>=2.17,<3.0",
    "dash-mantine-components>=0.14",
    "dash-iconify>=0.1.2",
    "plotly>=5.22,<6.0",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.1",
    "flask-caching>=2.1",
    "pyarrow>=15",
    "gunicorn>=22",
    "requests>=2.31",
    "googletrans==4.0.0rc1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "black>=24",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
